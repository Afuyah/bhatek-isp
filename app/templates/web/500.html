{% extends "web/base.html" %}

{% block title %}Something went wrong | Bhatek ISP{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="bg-white rounded-lg shadow p-6 text-center">
    <p class="text-2xl font-semibold text-gray-900">500</p>
    <p class="text-sm text-gray-600">Something went wrong on our side.</p>
    <p class="text-sm text-gray-600">The problem has been logged. Please try again in a moment.</p>
    <div class="flex items-center justify-between">
      <a href="{{ url_for('web.index') }}" class="text-green-600 font-semibold">Back to home</a>
      <a href="javascript:history.back()" class="text-green-600 font-semibold">Go back</a>
    </div>
  </div>
</div>
{% endblock %}
