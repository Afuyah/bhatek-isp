{% extends "web/base.html" %}

{% block title %}Page not found | Bhatek ISP{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="bg-white rounded-lg shadow p-6 text-center">
    <p class="text-2xl font-semibold text-gray-900">404</p>
    <p class="text-sm text-gray-600">We could not find the page you were looking for.</p>
    <p class="text-sm text-gray-600">The link may be broken, or the page may have been moved.</p>
    <div class="flex items-center justify-between">
      <a href="{{ url_for('web.index') }}" class="text-green-600 font-semibold">Back to home</a>
      <a href="{{ url_for('web.login') }}" class="text-green-600 font-semibold">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
